name: gitea
title: Gitea
description: Git hosting with its PostgreSQL database and a volume for repositories.
version: 1.0.0
parameters:
  - { name: domain, title: Domain, description: "Serve Gitea at this host name, with HTTPS.", type: hostname }
resources:
  - kind: database
    name: db
    spec: { engine: postgres, version: "16" }
  - kind: volume
    name: data
    spec: { type: filesystem }
  - kind: app
    name: ""
    spec:
      image: gitea/gitea:1.27.3
      port: 3000
      memoryMiB: 512
      env:
        GITEA__database__DB_TYPE: postgres
        GITEA__database__HOST: "${host:database/db}:5432"
        GITEA__database__NAME: "${ident:db}"
        GITEA__database__USER: "${ident:db}"
        GITEA__server__ROOT_URL: "https://${param:domain}/"
        GITEA__server__DISABLE_SSH: "true"
      secretEnv:
        GITEA__database__PASSWD: "${name:db}-password"
      volumes: [{ volume: "${name:data}", path: /data }]
  - kind: domain
    name: site
    when: "${param:domain}"
    spec: { hostname: "${param:domain}", app: "${name:}" }
outputs:
  url: "https://${param:domain}"
