name: Secret Scan

# Pull requests only: every commit reaches develop or main through a PR, which already ran these checks, so a
# push trigger would run them a second time on the same commit (L4-002 §1). Use "Run workflow" for a one-off.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI is free. The gitleaks GitHub Action demands a paid license for organisation-owned
      # repos, which would leave this required check red on every org repo from the first push.
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --verbose
