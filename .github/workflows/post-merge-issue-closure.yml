name: Post-Merge Issue Closure

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    name: Close Linked Issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by merged PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = [
              pr.title || "",
              pr.body || "",
            ].join("\n")
              .replace(/```[\s\S]*?```/g, "")
              .replace(/`[^`\n]+`/g, "");

            const closingReferencePattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/)?#?(\d+)\b/gi;
            const issueNumbers = new Set();
            let match;

            while ((match = closingReferencePattern.exec(source)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info(`No closing issue references found in PR #${pr.number}.`);
              return;
            }

            for (const issue_number of issueNumbers) {
              let issue;

              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number,
                }));
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`#${issue_number} was referenced by PR #${pr.number}, but no issue exists with that number.`);
                  continue;
                }

                throw error;
              }

              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request, skipping.`);
                continue;
              }

              if (issue.state === "closed") {
                core.info(`#${issue_number} is already closed, skipping.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Closing automatically after merged PR #${pr.number}: ${pr.html_url}`,
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });

              core.info(`Closed issue #${issue_number} from merged PR #${pr.number}.`);
            }
